{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "New Project" %} — YouAudioLab{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="h4 mb-1"><i class="bi bi-folder-plus"></i> {% trans "New Project" %}</h1>
    <p class="text-muted mb-0 small">{% trans "Create an audio research workspace." %}</p>
  </div>
  <div class="page-head__actions">
    <a class="btn btn-sm btn-outline-secondary" href="{% url 'project-list' %}">
      <i class="bi bi-arrow-left"></i> {% trans "Back" %}
    </a>
  </div>
</div>

<div class="row">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="name">{% trans "Name" %}</label>
            <input class="form-control" id="name" name="name" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="language">{% trans "Language" %}</label>
            <input class="form-control" id="language" name="language" value="vi" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="description">{% trans "Description" %}</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-check-lg"></i> {% trans "Create project" %}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
