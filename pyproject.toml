[project]
name = "youaudiolab-django"
version = "0.1.0"
description = "YouAudioLab Django parallel implementation (Django + DRF + Bootstrap 5)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django~=6.1.1",
    "djangorestframework~=3.18.0",
    "psycopg[binary]>=3.2.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "yt-dlp>=2024.12.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.8.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "bcrypt>=5.0.0",
    "PyJWT>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "postgres: tests that require PostgreSQL features (partial unique, advisory locks)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
